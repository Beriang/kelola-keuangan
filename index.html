<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelola Keuangan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="max-w-md mx-auto min-h-screen pb-28">
  <header class="px-4 py-4 flex items-center justify-between">
    <h1 class="text-xl font-extrabold text-indigo-700">Kelola Keuangan</h1>
    <button id="sync" onclick="pull().then(yieldAll)" class="text-xs px-3 py-1 rounded-full bg-white shadow">...</button>
  </header>
  <main id="main" class="px-4 space-y-4"></main>
</div>
<nav class="fixed bottom-0 inset-x-0 bg-white border-t"><div id="nav" class="max-w-md mx-auto grid grid-cols-3"></div></nav>
<div id="ov" class="hidden fixed inset-0 bg-black/50 z-50 items-end justify-center" onclick="if(event.target===this)closeSheet()">
  <div id="sh" class="bg-white w-full max-w-md rounded-t-3xl p-5 space-y-3 max-h-[90vh] overflow-auto"></div>
</div>
<div id="toast" class="hidden fixed top-4 inset-x-0 mx-auto w-fit z-[60] px-4 py-2 rounded-full bg-slate-900 text-white text-sm"></div>

<script>
const URL_SHEETS = "https://script.google.com/macros/s/AKfycbw5BHwhQumT3EVXQ4f7v36aaGXbbucApn_amkt3qea1QcubTQt59KZEscIYYX4rh-fVJA/exec";
const K = 'kk_v2', RATE = 0.025;
const DEF = ['Makan','Transport','Tagihan','Hiburan','Lainnya'].map((n,i)=>({id:'c'+i,name:n}));
const COL = ['#6366f1','#10b981','#f59e0b','#ef4444','#06b6d4','#a855f7','#84cc16','#ec4899'];
const $ = id => document.getElementById(id);
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today = () => new Date().toISOString().slice(0,10);
const isSea = a => /sea\s*bank/i.test(a.name);
let tab = 'home';

function load(){
  const o = JSON.parse(localStorage.getItem(K) || 'null');
  if (o) return o;
  const g = k => JSON.parse(localStorage.getItem(k) || 'null');
  const old = g('fin_categories') || [];
  return {accounts:g('fin_accounts')||[], categories:old.length?old:DEF, transactions:g('fin_transactions')||[], debts:g('fin_debts')||[], updatedAt:0};
}
let S = load();

const accName = id => S.accounts.find(a=>a.id===id)?.name || '?';
const catName = id => S.categories.find(c=>c.id===id)?.name || 'Tanpa kategori';
// Sisa anggaran = total pemasukan kategori - total pengeluaran kategori (tidak terpengaruh transfer antar akun)
const env = id => S.transactions.reduce((a,t)=> t.categoryId===id ? a + (t.type==='income'?Number(t.amount):t.type==='expense'?-Number(t.amount):0) : a, 0);
const alloc = id => S.transactions.reduce((a,t)=> t.categoryId===id && t.type==='income' ? a+Number(t.amount) : a, 0);

function save(){ S.updatedAt = Date.now(); localStorage.setItem(K, JSON.stringify(S)); render(); push(); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2500); }
function sheet(h){ $('sh').innerHTML=h; $('ov').classList.remove('hidden'); $('ov').classList.add('flex'); }
function closeSheet(){ $('ov').classList.add('hidden'); $('ov').classList.remove('flex'); }
function setTab(t){ tab=t; render(); }

// ---------- Sinkronisasi otomatis ----------
function setSync(s){
  const m = {ok:['bg-emerald-100 text-emerald-700','● Tersinkron'], busy:['bg-amber-100 text-amber-700','● Menyinkron...'], err:['bg-rose-100 text-rose-700','● Offline (data lokal)']}[s];
  $('sync').className = 'text-xs px-3 py-1 rounded-full shadow ' + m[0]; $('sync').textContent = m[1];
}
async function push(){
  if (!URL_SHEETS) return setSync('err');
  setSync('busy');
  try { await fetch(URL_SHEETS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)}); setSync('ok'); }
  catch(e){ setSync('err'); }
}
async function pull(){
  if (!URL_SHEETS) return setSync('err');
  setSync('busy');
  try {
    const c = await (await fetch(URL_SHEETS)).json();
    if (c && c.accounts) {
      const cu = Number(c.updatedAt) || 0, localHas = S.accounts.length || S.transactions.length;
      // Data cloud hanya dipakai jika lebih baru, atau lokal masih kosong. Selain itu data lokal dikirim ke cloud.
      if (cu > S.updatedAt || (!cu && !localHas)) {
        S = {accounts:c.accounts||[], categories:(c.categories&&c.categories.length)?c.categories:DEF, transactions:c.transactions||[], debts:c.debts||[], updatedAt:cu};
        localStorage.setItem(K, JSON.stringify(S)); render(); setSync('ok');
      } else await push();
    } else setSync('ok');
  } catch(e){ setSync('err'); }
}

// ---------- Bunga harian Seabank (2,5%/tahun, majemuk harian) ----------
function yieldAll(){
  const t = today(); let ch = false;
  S.accounts.forEach(a=>{
    if (!isSea(a)) return;
    if (!a.lastYieldDate){ a.lastYieldDate = t; ch = true; return; }
    const d = Math.floor((new Date(t)-new Date(a.lastYieldDate))/864e5);
    if (d <= 0) return;
    let b = Number(a.balance), g = 0;
    for (let i=0;i<d;i++){ const x = Math.round(b*RATE/365); g+=x; b+=x; }
    a.balance = b; a.lastYieldDate = t; ch = true;
    if (g > 0) S.transactions.unshift({id:uid(),date:t,type:'income',amount:g,accountId:a.id,categoryId:'',description:`Bunga harian Seabank (${d} hari)`});
  });
  if (ch) save();
}

// ---------- Tampilan ----------
function render(){
  $('nav').innerHTML = [['home','Beranda','🏠'],['hist','Riwayat','🧾'],['acc','Akun','🏦']].map(([k,l,i])=>
    `<button onclick="setTab('${k}')" class="py-3 text-xs font-semibold ${tab===k?'text-indigo-600':'text-slate-400'}"><div class="text-xl">${i}</div>${l}</button>`).join('');
  $('main').innerHTML = tab==='home' ? home() : tab==='hist' ? hist() : acc();
}

function home(){
  const total = S.accounts.reduce((a,x)=>a+Number(x.balance),0);
  const sea = S.accounts.filter(isSea).reduce((a,x)=>a+Math.round(x.balance*RATE/365),0);
  const es = S.categories.map(c=>({c,r:env(c.id),al:alloc(c.id)})).filter(x=>x.r!==0);
  return `
  <div class="rounded-3xl p-5 text-white bg-gradient-to-br from-indigo-600 to-violet-600 shadow-lg">
    <div class="text-sm opacity-80">Total saldo</div>
    <div class="text-3xl font-extrabold">${rp(total)}</div>
    ${sea?`<div class="text-xs mt-1 opacity-80">Bunga Seabank ± ${rp(sea)}/hari</div>`:''}
  </div>
  <div class="grid grid-cols-3 gap-2">
    <button onclick="openTx('income')" class="py-3 rounded-2xl bg-white shadow font-semibold text-emerald-600"><div class="text-xl">⬇️</div><span class="text-xs">Pemasukan</span></button>
    <button onclick="openTx('expense')" class="py-3 rounded-2xl bg-white shadow font-semibold text-rose-600"><div class="text-xl">⬆️</div><span class="text-xs">Pengeluaran</span></button>
    <button onclick="openTf()" class="py-3 rounded-2xl bg-white shadow font-semibold text-indigo-600"><div class="text-xl">🔁</div><span class="text-xs">Pindah Saldo</span></button>
  </div>
  <section class="bg-white rounded-3xl p-4 shadow space-y-3">
    <h2 class="font-bold">Sisa Anggaran</h2>
    ${es.length ? es.map(x=>{
      const p = x.al>0 ? Math.max(0,Math.min(100,x.r/x.al*100)) : 0;
      const col = x.r<0?'bg-rose-500':p<25?'bg-amber-500':'bg-emerald-500';
      return `<div><div class="flex justify-between text-sm"><span>${esc(x.c.name)}</span><b class="${x.r<0?'text-rose-600':''}">${rp(x.r)}</b></div>
        <div class="h-2 rounded-full bg-slate-100 mt-1"><div class="h-2 rounded-full ${col}" style="width:${p}%"></div></div>
        <div class="text-[11px] text-slate-400">dari total ${rp(x.al)}</div></div>`;
    }).join('') : '<p class="text-sm text-slate-400">Belum ada anggaran. Catat pemasukan dan pilih "untuk apa".</p>'}
  </section>
  ${chart()}`;
}

function chart(){
  const m = today().slice(0,7), by = {};
  S.transactions.filter(t=>t.type==='expense' && String(t.date).startsWith(m)).forEach(t=>{ const n=catName(t.categoryId); by[n]=(by[n]||0)+Number(t.amount); });
  const e = Object.entries(by).sort((a,b)=>b[1]-a[1]), tot = e.reduce((a,x)=>a+x[1],0);
  let body = '<p class="text-sm text-slate-400">Belum ada pengeluaran bulan ini.</p>';
  if (tot){
    let off = 0;
    const arcs = e.map(([n,v],i)=>{ const p=v/tot*100; const s=`<circle r="15.9" cx="21" cy="21" fill="none" stroke="${COL[i%COL.length]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`; off+=p; return s; }).join('');
    body = `<div class="flex items-center gap-4"><svg viewBox="0 0 42 42" class="w-32 h-32 shrink-0"><circle r="15.9" cx="21" cy="21" fill="none" stroke="#f1f5f9" stroke-width="6"/>${arcs}</svg>
      <div class="text-xs space-y-1 flex-1">${e.map(([n,v],i)=>`<div class="flex justify-between gap-2"><span><i class="inline-block w-2 h-2 rounded-full mr-1" style="background:${COL[i%COL.length]}"></i>${esc(n)}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div>
      <div class="text-sm text-slate-500 mt-2">Total keluar bulan ini: <b>${rp(tot)}</b></div>`;
  }
  return `<section class="bg-white rounded-3xl p-4 shadow space-y-3"><h2 class="font-bold">Pengeluaran Bulan Ini</h2>${body}</section>`;
}

function hist(){
  if (!S.transactions.length) return '<p class="text-center text-slate-400 mt-10">Belum ada transaksi.</p>';
  return `<section class="bg-white rounded-3xl shadow divide-y">${S.transactions.slice(0,100).map(t=>{
    const inc=t.type==='income', tf=t.type==='transfer';
    return `<div class="p-3 flex items-center gap-3"><div class="text-xl">${tf?'🔁':inc?'⬇️':'⬆️'}</div>
      <div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${esc(t.description)}</div>
      <div class="text-[11px] text-slate-400">${esc(t.date)} · ${tf?esc(accName(t.accountId))+' → '+esc(accName(t.targetAccountId)):esc(catName(t.categoryId))+' · '+esc(accName(t.accountId))}</div></div>
      <b class="text-sm ${tf?'text-indigo-600':inc?'text-emerald-600':'text-rose-600'}">${tf?'':inc?'+':'-'}${rp(t.amount)}</b>
      <button onclick="delTx('${t.id}')" class="text-slate-300 px-1">✕</button></div>`;}).join('')}</section>`;
}

function acc(){
  return `<button onclick="openAcc()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-bold">+ Tambah Akun</button>
  <section class="bg-white rounded-3xl shadow divide-y">${S.accounts.map(a=>`<div class="p-4 flex justify-between items-center">
    <div><div class="font-semibold">${esc(a.name)}</div>${isSea(a)?'<div class="text-[11px] text-emerald-600">Bunga harian 2,5%/tahun aktif</div>':''}</div>
    <b>${rp(a.balance)}</b></div>`).join('') || '<p class="p-4 text-sm text-slate-400">Belum ada akun.</p>'}</section>`;
}

// ---------- Form ----------
const inp = 'w-full mt-1 p-3 rounded-xl bg-slate-100 text-base';
const fld = l => `<label class="block text-xs font-semibold text-slate-500 mt-2">${l}</label>`;
const accOpts = () => S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${rp(a.balance)}</option>`).join('');

function openTx(type){
  if (!S.accounts.length){ setTab('acc'); return openAcc(); }
  const inc = type==='income';
  const cat = inc
    ? fld('Untuk apa? (pilih atau ketik kategori baru)') + `<input id="f-cat" list="dl" placeholder="mis. Makan" class="${inp}"><datalist id="dl">${S.categories.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`
    : fld('Kategori anggaran') + `<select id="f-cat" class="${inp}">${S.categories.map(c=>`<option value="${c.id}">${esc(c.name)} — sisa ${rp(env(c.id))}</option>`).join('')}</select>`;
  sheet(`<h2 class="font-bold text-lg">${inc?'Catat Pemasukan':'Catat Pengeluaran'}</h2>
    <input id="f-amt" type="number" inputmode="numeric" placeholder="Nominal (Rp)" class="${inp} text-2xl font-bold">
    ${fld(inc?'Masuk ke akun':'Dari akun')}<select id="f-acc" class="${inp}">${accOpts()}</select>
    ${cat}
    <input id="f-desc" placeholder="Catatan (opsional)" class="${inp} mt-2">
    <input id="f-date" type="date" value="${today()}" class="${inp}">
    <button onclick="saveTx('${type}')" class="w-full py-3 rounded-xl text-white font-bold ${inc?'bg-emerald-600':'bg-rose-600'}">Simpan</button>`);
}

function saveTx(type){
  const amt = Math.round(parseFloat($('f-amt').value)), aid = $('f-acc').value, a = S.accounts.find(x=>x.id===aid);
  if (!(amt>0)) return toast('Isi nominal dulu');
  let cid = '';
  if (type==='income'){
    const n = $('f-cat').value.trim();
    if (n){ let c = S.categories.find(c=>c.name.toLowerCase()===n.toLowerCase()); if(!c){ c={id:uid(),name:n}; S.categories.push(c); } cid=c.id; }
  } else {
    cid = $('f-cat').value;
    if (amt>env(cid) && !confirm(`Melebihi sisa anggaran (${rp(env(cid))}). Lanjutkan?`)) return;
    if (a.balance<amt && !confirm('Saldo akun tidak cukup. Lanjutkan?')) return;
  }
  a.balance = Number(a.balance) + (type==='income'?amt:-amt);
  S.transactions.unshift({id:uid(),date:$('f-date').value||today(),type,amount:amt,accountId:aid,categoryId:cid,description:$('f-desc').value.trim()||(type==='income'?'Pemasukan':'Pengeluaran')});
  closeSheet(); save(); toast('Tersimpan');
}

function openTf(){
  if (S.accounts.length<2) return toast('Butuh minimal 2 akun');
  sheet(`<h2 class="font-bold text-lg">Pindah Saldo</h2>
    ${fld('Dari')}<select id="t-from" class="${inp}">${accOpts()}</select>
    <div class="text-center text-2xl">⬇️</div>
    ${fld('Ke')}<select id="t-to" class="${inp}">${accOpts()}</select>
    <input id="t-amt" type="number" inputmode="numeric" placeholder="Nominal (Rp)" class="${inp} text-2xl font-bold mt-2">
    <p class="text-xs text-slate-400">Anggaran tidak berubah saat pindah saldo.</p>
    <button onclick="saveTf()" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold">Pindahkan</button>`);
  $('t-to').selectedIndex = 1;
}

function saveTf(){
  const f=$('t-from').value, t=$('t-to').value, amt=Math.round(parseFloat($('t-amt').value));
  if (f===t) return toast('Akun asal dan tujuan harus berbeda');
  if (!(amt>0)) return toast('Isi nominal dulu');
  const A=S.accounts.find(a=>a.id===f), B=S.accounts.find(a=>a.id===t);
  if (A.balance<amt) return toast('Saldo akun asal tidak cukup');
  A.balance=Number(A.balance)-amt; B.balance=Number(B.balance)+amt;
  S.transactions.unshift({id:uid(),date:today(),type:'transfer',amount:amt,accountId:f,targetAccountId:t,description:`Pindah saldo ${A.name} → ${B.name}`});
  closeSheet(); save(); toast('Saldo dipindahkan');
}

function openAcc(){
  sheet(`<h2 class="font-bold text-lg">Akun Baru</h2>
    <input id="a-name" placeholder="Nama (mis. BCA, Seabank)" class="${inp}">
    <input id="a-bal" type="number" inputmode="numeric" placeholder="Saldo awal (Rp)" class="${inp}">
    <p class="text-xs text-slate-400">Akun bernama "Seabank" otomatis mendapat bunga harian 2,5%/tahun.</p>
    <button onclick="saveAcc()" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold">Simpan</button>`);
}
function saveAcc(){
  const n=$('a-name').value.trim(); if(!n) return toast('Isi nama akun');
  S.accounts.push({id:uid(),name:n,balance:Math.round(parseFloat($('a-bal').value))||0,lastYieldDate:today()});
  closeSheet(); save();
}

function delTx(id){
  const t=S.transactions.find(x=>x.id===id); if(!t||!confirm('Hapus transaksi ini? Saldo akun akan dikembalikan.')) return;
  S.accounts.forEach(a=>{
    const m=Number(t.amount);
    if (t.type==='income' && a.id===t.accountId) a.balance-=m;
    if (t.type==='expense' && a.id===t.accountId) a.balance+=m;
    if (t.type==='transfer'){ if(a.id===t.accountId) a.balance+=m+(t.fee||0); if(a.id===t.targetAccountId) a.balance-=m; }
  });
  S.transactions=S.transactions.filter(x=>x.id!==id); save();
}

render();
pull().then(yieldAll);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull().then(yieldAll); });
</script>
</body>
</html>
